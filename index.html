<style>
:root{--bg:#EFF3F6;--sf:#fff;--ink:#26323D;--mut:#5C6C76;--ac:#3F6F94;--onac:#fff;--acs:#E1EAF1;--ln:#C9D4DC;--gd:#E0A15E;--dg:#B0602F;--sg:#6FA287;--ck:#9FB0BC;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191E;--sf:#1C232A;--ink:#E4EAEF;--mut:#9AA9B3;--ac:#7FA9CB;--onac:#0F1720;--acs:#243240;--ln:#2E3A45;--gd:#E3B079;--dg:#E8A06A;--sg:#8DBBA2;--ck:#4B5B68;--hl:rgba(255,255,255,.12);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14191E;--sf:#1C232A;--ink:#E4EAEF;--mut:#9AA9B3;--ac:#7FA9CB;--onac:#0F1720;--acs:#243240;--ln:#2E3A45;--gd:#E3B079;--dg:#E8A06A;--sg:#8DBBA2;--ck:#4B5B68;--hl:rgba(255,255,255,.12);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px calc(92px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:0;font-weight:700}
h2{font-size:17px;margin:0;font-weight:650}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.mut{color:var(--mut);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 0;font-size:15px;border-radius:10px}
nav button.on{color:var(--ac);font-weight:700;background:var(--acs)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mh button{width:44px;height:44px;border:0;background:var(--sf);border-radius:12px;font-size:22px;color:var(--ac)}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk span{font-size:13px;color:var(--mut);padding:4px 0}
.grid{gap:4px;margin-bottom:18px}
.day{position:relative;aspect-ratio:1/1.05;border:0;background:var(--sf);border-radius:12px;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.day.tod{box-shadow:inset 0 0 0 1.5px var(--gd)}
.day.sel{background:var(--ac);color:var(--onac)}
.dts{display:flex;gap:3px;height:5px}
.day b{width:5px;height:5px;border-radius:50%}
.day b.dot{background:var(--gd)}
.day b.rec{background:var(--ac)}
.day.sel b.dot,.day.sel b.rec{background:var(--onac)}
.card img{cursor:zoom-in}
.sech{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.pri,.gh{border:0;border-radius:12px;padding:11px 18px;font-weight:600}
.pri{background:var(--ac);color:var(--onac)}
.gh{background:var(--acs);color:var(--ac)}
.sm{padding:8px 14px;font-size:14px}
.row{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.ck{flex:0 0 28px;width:28px;height:28px;min-width:28px;min-height:28px;aspect-ratio:1/1;padding:0;margin:0;-webkit-appearance:none;appearance:none;border-radius:50%;border:2px solid var(--ac);background:none;position:relative}
.ck.on{background:var(--ac)}
.ck.on::after{content:"";position:absolute;left:8px;top:3px;width:7px;height:13px;border:solid var(--onac);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.rt{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.tt{font-size:16px;word-break:break-word}
.tt.dn{color:var(--mut);text-decoration:line-through}
.sub{font-size:13px;color:var(--mut)}
.late{color:var(--dg);font-weight:600}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar b{font-size:17px;color:var(--ac);letter-spacing:.5px}
.ic{border:0;background:var(--acs);color:var(--ac);padding:8px 14px;border-radius:10px;font-weight:600}
.tg{display:inline-block;font-size:12px;padding:0 7px;border-radius:8px;border:1px solid var(--tc,var(--ln));color:var(--tc,var(--mut));line-height:1.6}
.tg.pr1{--tc:var(--gd)}
.tg.pr2{background:var(--gd);border-color:var(--gd);color:#fff}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:18px}
.st div{background:var(--sf);border-radius:14px;padding:12px}
.st b{display:block;font-size:22px;color:var(--ac)}
.st span{font-size:13px;color:var(--mut)}
.cr{display:flex;gap:10px;margin-bottom:8px}
.cr input{margin-top:0}
.cr input[type=color]{width:52px;height:44px;padding:3px}
.card img{margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:26px 10px;background:var(--sf);border-radius:14px;font-size:15px}
.prog{height:8px;background:var(--acs);border-radius:4px;margin:0 0 16px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);border-radius:4px}
.card{background:var(--sf);border-radius:14px;padding:14px;margin-bottom:10px}
.card img{width:100%;border-radius:10px;margin-top:10px;display:block}
.card p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.card .x{border:0;background:none;color:var(--dg);font-size:13px;padding:8px 0 0}
.note{background:var(--acs);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.note button{margin-top:8px}
#sh{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end}
#sh[hidden]{display:none}
.bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.pn{position:relative;width:100%;max-width:560px;margin:0 auto;background:var(--sf);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto}
.pn h2{margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:12px}
input,textarea,select{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.bt{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.chips{display:flex;gap:6px;margin:6px 0 14px}
.chips button{flex:1;height:40px;border:1px solid var(--ln);background:var(--bg);border-radius:10px}
.chips button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
#tt{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:20;font-size:15px}
#tt[hidden]{display:none}
/* refinement */
:root{--hl:rgba(38,50,61,.12);--serif:"Songti TC","Noto Serif TC","Source Han Serif TC",Georgia,serif}

.sech{margin:28px 0 6px}
.row{background:none;border-radius:0;margin:0;padding:15px 2px;gap:14px;border-bottom:1px solid var(--hl)}
.ck{flex:0 0 26px;width:26px;height:26px;min-width:26px;min-height:26px;border:1.5px solid var(--ck)}

.grid{gap:2px 0;margin-bottom:6px}

.day.tod{box-shadow:none;color:var(--gd);font-weight:700}
.day.sel,.day.tod.sel{background:var(--ac);color:var(--onac)}
.st div{background:none;border-radius:0;border-top:1px solid var(--hl);padding:12px 0}
.st b{font-family:var(--serif);font-size:26px}
nav{border-top:1px solid var(--hl);padding-top:2px}
nav button{position:relative;border-radius:0;font-size:14px;padding:12px 0 8px}

.pri{border-radius:999px}
.gh{background:none;border:1px solid var(--hl);color:var(--ink);border-radius:999px}
.chips button{border-color:var(--hl);border-radius:999px;background:none}
input,textarea,select{border-color:var(--hl);border-radius:12px}
.fab{position:fixed;right:20px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;padding:0;border:0;border-radius:50%;background:var(--ac);color:var(--onac);font-size:30px;line-height:1;box-shadow:0 8px 20px rgba(63,111,148,.30);z-index:4}
.pn{border-radius:22px 22px 0 0;animation:up .24s ease-out}
.pn::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--hl);margin:-8px auto 16px}
@keyframes up{from{transform:translateY(28px);opacity:0}}
@media(prefers-reduced-motion:reduce){.pn{animation:none}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.day.tod{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--gd);font-weight:600}
.day.sel,.day.tod.sel{box-shadow:none;font-weight:600}
.day b.rec{background:var(--sg)}
.tg.pr2{color:#26323D}

/* Daynote scrapbook */
:root{--frame:#CFE0B5;--bg:#FBF5E6;--sf:#FFFCF2;--ink:#4A3426;--mut:#7D6753;--ac:#A9CC8F;--onac:#3A2A1E;--acs:#E4EDCF;--ln:#E2D6BC;--hl:rgba(90,64,48,.28);--bd:#5A4030;--gd:#E9A94B;--dg:#C0645A;--sg:#6BA166;--ck:#5A4030;--note:#FFF1B0;--blue:#D3E6F2;--pink:#F8D5D2;--yel:#FBE9A8;--grn:#DCE9C6;--serif:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color-scheme:light}

h1{font-size:26px;font-weight:400}

.ic{border:2px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--ink);padding:5px 12px;font-size:14px;font-weight:400;box-shadow:2px 2px 0 rgba(90,64,48,.2)}

<button data-v="month"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16v13.5H4zM4 10.5h16M8 3.5v4M16 3.5v4"/></svg><span>月曆</span></button>
<button data-v="daily"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5h15v14.5h-15zM8 12.5l3 3 5-6"/></svg><span>每日任務</span></button>

<script>
const $=s=>document.querySelector(s),K='daily-planner-v1',WD='日一二三四五六';
let S={tasks:[],daily:[],done:{},set:{theme:'auto'},cats:[{id:'c1',n:'學習',c:'#F0D27A'},{id:'c2',n:'工作',c:'#A9C4DD'},{id:'c3',n:'生活',c:'#EFB3B0'},{id:'c4',n:'運動',c:'#9CC59A'},{id:'c5',n:'娛樂',c:'#C9B3E0'},{id:'c6',n:'其他',c:'#CFC3AE'}]},view='today',sel,cm=new Date();
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const pad=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date()),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

let DB;const QS={low:[480,.55],std:[720,.7],hi:[1080,.8]},URLS={};
const idb=()=>DB||(DB=new Promise((ok,no)=>{const r=indexedDB.open('everyday',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('img')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
const tx=(st,mode,fn)=>idb().then(d=>new Promise((ok,no)=>{const t=d.transaction(st,mode),q=fn(t.objectStore(st));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)}));

async function boot(){
  try{
    try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
    let st=await kvGet('state');
    if(!st){
      st=S;
      for(const v of Object.values(st.done)){const old=v.imgs||(v.img?[v.img]:[]),ids=[];
        for(const s of old){if(typeof s==='string'&&s.startsWith('data:')){const id=uid();await imPut(id,d2b(s));ids.push(id)}else ids.push(s)}
        v.imgs=ids;delete v.img}
      await kvPut('state',st);
      if(!(await kvGet('state')))throw 0;
      toast('資料已升級到新的儲存方式');

async function doImp(mode){

    const o=JSON.parse(await f.text());if(!o.tasks||!o.daily||!o.done)throw 0;
    for(const [id,u] of Object.entries(o.photos||{}))await imPut(id,d2b(u));
    for(const v of Object.values(o.done)){const old=v.imgs||(v.img?[v.img]:[]);v.imgs=[];
      for(const s of old){if(s.startsWith('data:')){const id=uid();await imPut(id,d2b(s));v.imgs.push(id)}else v.imgs.push(s)}delete v.img}
    delete o.photos;

      o.tasks.forEach(x=>{if(!has(S.tasks,x.id))S.tasks.push(x)});o.daily.forEach(x=>{if(!has(S.daily,x.id))S.daily.push(x)});
      Object.entries(o.done).forEach(([k,v])=>{if(!S.done[k])S.done[k]=v})}

}

    const days=[...document.querySelectorAll('#wd .on')].map(b=>+b.dataset.w);
    if(!v('#f1')){toast('請輸入任務名稱');return}
    if(!days.length){toast('請至少選一天');return}
    const o={title:v('#f1'),days,time:$('#f3').value,c:$('#f5').value,p:+$('#f6').value};
    if(id)Object.assign(S.daily.find(x=>x.id===id),o);else S.daily.push(Object.assign({id:uid(),start:today()},o));
    save();closeSh();render()}
  else if(a==='delt'){S.tasks=S.tasks.filter(x=>x.id!==id);save();closeSh();render()}
  else if(a==='deld'){S.daily=S.daily.filter(x=>x.id!==id);save();closeSh();render()}
  else if(a==='ck'){const k=el.dataset.k;if(S.done[k]){ims(S.done[k]).forEach(imDel);delete S.done[k];save();render()}else fComp(k)}
  else if(a==='savec'){
    const k=el.dataset.k,i=itemsFor(k.split('|')[1]).find(x=>x.k===k),f=$('#f2').files[0];
    el.disabled=true;
    S.done[k]={title:i.title,date:k.split('|')[1],text:v('#f1'),imgs:await saveImgs([...$('#f2').files]),c:i.c,ts:Date.now()};
    save();closeSh();render()}
  else if(a==='delr'){if(!el.dataset.c){el.dataset.c=1;el.textContent='再按一次確認移除';return}ims(S.done[el.dataset.k]).forEach(imDel);delete S.done[el.dataset.k];save();render()}
  else if(a==='notif'){try{await Notification.requestPermission()}catch(x){}render()}
  else if(a==='exp'){doExp()}
  else if(a==='expx'){
    const j=JSON.stringify(S);openSh(`<h2>匯出備份</h2><label>以下是全部資料，請複製後貼到備忘錄保存<textarea id="f1" rows="6" readonly>${esc(j)}</textarea></label><div class="bt"><button class="gh" data-a="close">關閉</button><button class="pri" data-a="copy">複製</button></div>`)}
  else if(a==='copy'){try{await navigator.clipboard.writeText($('#f1').value);toast('已複製')}catch(x){$('#f1').select();toast('請長按選取後拷貝')}}
  else if(a==='imp')openSh(`<h2>匯入備份</h2><label>選擇備份檔（.json）<input id="f1" type="file" accept=".json,application/json"></label><div class="mut" style="margin-bottom:12px">合併：只加入目前沒有的資料。覆蓋：用備份檔取代目前的任務與紀錄。</div><div class="bt"><button class="gh" data-a="close">取消</button><button class="gh" data-a="imm">合併匯入</button><button class="pri" data-a="imo">覆蓋匯入</button></div>`);
  else if(a==='doimp'){try{const o=JSON.parse($('#f1').value);if(!o.tasks||!o.daily||!o.done)throw 0;S=Object.assign({cats:S.cats,set:S.set},o);save();applyTheme();closeSh();render();toast('匯入完成')}catch(x){toast('資料格式不正確')}}
});
const fired=new Set();
function tick(){
  const d=today(),hm=nowHM();
  itemsFor(d).forEach(i=>{
    if(i.time===hm&&!S.done[i.k]&&!fired.has(i.k)){
      fired.add(i.k);toast('提醒：'+i.title);
      if('Notification' in window&&Notification.permission==='granted'){try{new Notification('任務提醒',{body:i.title})}catch(x){}}
    }});
  if(!$('#sh').hidden)return;
  if(view==='today')render();
}
setInterval(tick,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#sh').hidden){sel=sel||today();render()}});
applyTheme();boot();
</script>
</body>
</html>
